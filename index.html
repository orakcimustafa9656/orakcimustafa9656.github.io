  <style>
    :root{
      --green:#12382f;
      --green-2:#1b4b40;
      --ink:#17201d;
      --muted:#65706b;
      --paper:#f6f7f4;
      --white:#fff;
      --line:#dfe5e1;
      --soft:#edf1ee;
      --shadow:0 20px 60px rgba(18,56,47,.10);
      --radius:24px;
      --max:1180px;
    }

    *{
      box-sizing:border-box
    }

    html{
      scroll-behavior:smooth
    }

    body{
      margin:0;
      color:var(--ink);
      background:var(--paper);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      line-height:1.6;
    }

    a{
      color:inherit;
      text-decoration:none
    }

    .container{
      width:min(var(--max),calc(100% - 40px));
      margin:auto
    }

    .nav{
      position:sticky;
      top:0;
      z-index:30;
      backdrop-filter:blur(14px);
      background:rgba(246,247,244,.88);
      border-bottom:1px solid rgba(223,229,225,.75);
    }

    .nav-inner{
      height:76px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:24px
    }

    .brand{
      display:flex;
      flex-direction:column;
      line-height:1.1
    }

    .brand strong{
      font-size:19px;
      letter-spacing:-.02em
    }

    .brand span{
      font-size:11px;
      color:var(--muted);
      letter-spacing:.11em;
      text-transform:uppercase;
      margin-top:6px
    }

    .menu{
      display:flex;
      gap:26px;
      align-items:center;
      font-size:14px;
      color:#3d4843
    }

    .menu a{
      position:relative;
      padding:8px 0
    }

    .menu a:after{
      content:"";
      position:absolute;
      left:0;
      right:100%;
      bottom:1px;
      height:1px;
      background:var(--green);
      transition:.25s ease;
    }

    .menu a:hover:after{
      right:0
    }

    .hero{
      padding:88px 0 84px
    }

    .hero-grid{
      display:grid;
      grid-template-columns:1.05fr .95fr;
      gap:70px;
      align-items:center
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:9px;
      font-size:12px;
      font-weight:700;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--green);
      margin-bottom:20px
    }

    .eyebrow:before{
      content:"";
      width:28px;
      height:1px;
      background:currentColor
    }

    h1{
      font-size:clamp(48px,6vw,78px);
      line-height:1.02;
      letter-spacing:-.055em;
      margin:0 0 26px;
      max-width:700px;
      font-weight:750
    }

    .hero-copy{
      font-size:18px;
      color:var(--muted);
      max-width:670px;
      margin-bottom:32px
    }

    .cta-row{
      display:flex;
      gap:12px;
      flex-wrap:wrap
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:14px 20px;
      border-radius:14px;
      border:1px solid var(--green);
      font-weight:700;
      font-size:14px;
      transition:.25s ease
    }

    .btn-primary{
      background:var(--green);
      color:#fff
    }

    .btn-primary:hover{
      background:var(--green-2);
      transform:translateY(-2px)
    }

    .btn-light{
      background:transparent;
      color:var(--green)
    }

    .btn-light:hover{
      background:var(--white);
      transform:translateY(-2px)
    }

    .hero-card{
      min-height:470px;
      border-radius:32px;
      background:var(--green);
      color:#fff;
      padding:34px;
      position:relative;
      overflow:hidden;
      box-shadow:var(--shadow)
    }

    .hero-card:before,
    .hero-card:after{
      content:"";
      position:absolute;
      border:1px solid rgba(255,255,255,.14);
      border-radius:50%
    }

    .hero-card:before{
      width:440px;
      height:440px;
      right:-150px;
      top:-110px
    }

    .hero-card:after{
      width:310px;
      height:310px;
      left:-165px;
      bottom:-170px
    }

    .card-kicker{
      font-size:12px;
      letter-spacing:.12em;
      text-transform:uppercase;
      opacity:.68
    }

    .metric{
      margin-top:125px;
      position:relative;
      z-index:2
    }

    .metric-value{
      font-size:74px;
      line-height:1;
      font-weight:750;
      letter-spacing:-.06em
    }

    .metric-label{
      font-size:18px;
      margin-top:12px;
      opacity:.9
    }

    .mini-grid{
      position:absolute;
      left:34px;
      right:34px;
      bottom:34px;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      z-index:2
    }

    .mini{
      padding:14px;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.06);
      border-radius:16px
    }

    .mini b{
      display:block;
      font-size:13px
    }

    .mini span{
      display:block;
      font-size:11px;
      opacity:.66;
      margin-top:4px
    }

    section{
      padding:88px 0
    }

    .section-head{
      display:flex;
      justify-content:space-between;
      gap:30px;
      align-items:end;
      margin-bottom:38px
    }

    .section-head h2{
      font-size:42px;
      line-height:1.05;
      letter-spacing:-.045em;
      margin:0;
      max-width:600px
    }

    .section-head p{
      max-width:470px;
      color:var(--muted);
      margin:0
    }

    .services{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:16px
    }

    .service{
      background:var(--white);
      border:1px solid var(--line);
      border-radius:20px;
      padding:28px;
      min-height:245px;
      transition:.25s ease
    }

    .service:hover{
      transform:translateY(-5px);
      box-shadow:var(--shadow);
      border-color:#cfd8d3
    }

    .num{
      font-size:12px;
      letter-spacing:.12em;
      color:var(--green);
      font-weight:800
    }

    .service h3{
      font-size:21px;
      letter-spacing:-.02em;
      margin:58px 0 11px
    }

    .service p{
      font-size:14px;
      color:var(--muted);
      margin:0
    }

    .dark{
      background:var(--green);
      color:#fff
    }

    .dark .section-head p{
      color:rgba(255,255,255,.68)
    }

    .approach{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:70px;
      align-items:start
    }

    .approach h2{
      font-size:45px;
      line-height:1.05;
      letter-spacing:-.045em;
      margin:0 0 18px
    }
